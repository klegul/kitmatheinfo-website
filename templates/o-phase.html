<html lang="de">
<head>
	{% block title %}
		<title>{{ config.title }}</title>
	{% endblock title %}
	<meta charset="utf-8" />
	{% block meta_description %}
		{% if config.description %}<meta name="description" content="{{ config.description }}" />{% endif %}
	{% endblock meta_description %}
	<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
	<link rel="stylesheet" href="{{ get_url(path="css/ophase.css") | safe }}" />
	<noscript><link rel="stylesheet" href="{{ get_url(path="css/noscript.css") | safe }}" /></noscript>
	{% block opengraph %}
		<meta property="og:type" content="website">
		<meta property="og:title" content="{{ config.title }}">
		<meta property="og:url" content="{{ current_url | safe }}">
		<meta property="og:image" content="{{ config.extra.social_image}}">
		<meta property="og:description" content="{{ config.description }}">
	{% endblock opengraph %}
	<meta name="google-site-verification" content="1km4QrlLUFdFIzaimoxiUEYcYZgRHoqVYgBRheax2_M" />
</head>

<body>
    <div class="wrapper">
        <div class="header">
            <div class="logo">
                <img src="{{ get_url(path="images/duck_in_puddle.svg") | safe }}" width="100px" alt="Logo">
                <h1>kitmatheinfo.net</h1>
            </div>
            <div class="navbar">
                <a class="button" href="https://discord.gg/z9B2Fhv78j">
                    <img src="{{ get_url(path="images/discord.svg") | safe }}" width="20px" alt="Logo">
                    Discord
                </a>
                <a class="button" href="https://fahrplan.kitmatheinfo.net">Fahrplan</a>
                <a class="button" href="https://entenjagd.kitmatheinfo.net">CTF Minigame</a>
            </div>
        </div>
        <div class="content">
            <h2>O-Phase 2025</h2>
            <h3>20. bis 26. Oktober 2025</h3>

            <div class="vorstellungs-video">
                <iframe width="100%" height="100%" src="https://www.youtube-nocookie.com/embed/J-5uXTu0tVI" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
            </div>


        </div>
    </div>
</body>
</html>
